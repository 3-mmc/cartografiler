[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartografiler"
version = "0.1.0"
description = "A native file manager mapping the whole filesystem as one continuous world"
requires-python = ">=3.11"

dependencies = ["numpy>=2.2", "scipy>=1.15"]

[project.optional-dependencies]
images = ["Pillow>=10"]
performance = ["numba", "zstandard"]

[project.scripts]
cartografiler = "branchfm.service:launch"
branch = "branchfm.app:main"

[tool.setuptools.packages.find]
include = ["branchfm*"]
