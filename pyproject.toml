[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-fm"
version = "0.1.0"
description = "A spatial terminal file manager with branching folders and selection previews"
requires-python = ">=3.11"

[project.optional-dependencies]
images = ["Pillow>=10"]

[project.scripts]
branch = "branchfm.app:main"

[tool.setuptools.packages.find]
include = ["branchfm*"]
