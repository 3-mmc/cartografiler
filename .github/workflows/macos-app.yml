name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [macos-standalone]
permissions:
  contents: read
jobs:
  apple-silicon:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMBA_CACHE_DIR: ${{ github.workspace }}/build/numba-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
          cache: pip
      - name: Install bundle dependencies
        run: python -m pip install -e '.[images,performance,macos-build]'
      - name: Build and validate standalone app
        run: python tools/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cartografiler-macos-arm64
          path: |
            dist/Cartografiler-macos-arm64.zip
            dist/package-check.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-diagnostics
          path: |
            ~/Library/Logs/Cartografiler/
            build/Cartografiler/warn-Cartografiler.txt
          if-no-files-found: ignore
